<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Knotty</title>
<meta name="description" content="Get the Knotty app for iOS or Android.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon.png">
<script>
  // Redirect before the fallback page paints, so a QR scan lands straight in
  // the store instead of flashing this page first. iPadOS reports as a Mac
  // in its default UA, so multi-touch is the tell for "this is actually iOS".
  (function () {
    var ua = navigator.userAgent;
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var APP_STORE_URL = "https://apps.apple.com/app/id6795073999";
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.ponyokikii.knotty";
    if (isAndroid) {
      window.location.replace(PLAY_STORE_URL);
    } else if (isIOS) {
      window.location.replace(APP_STORE_URL);
    }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <a href="index.html"><img src="icon.png" alt="Knotty app icon"></a>
    <a href="index.html" class="brand">Knotty</a>
  </header>

  <h1>Get Knotty</h1>
  <p class="lede">Pick your store to download Knotty.</p>

  <div class="store-links">
    <a href="https://apps.apple.com/app/id6795073999"><img class="store-badge" src="app-store-badge.svg" alt="Download on the App Store"></a>
    <a href="https://play.google.com/store/apps/details?id=com.ponyokikii.knotty"><img class="store-badge" src="google-play-badge.png" alt="Get it on Google Play"></a>
  </div>

  <p class="muted"><a href="index.html">&larr; Back to Knotty</a></p>

  <footer class="site-footer">
    <nav>
      <a href="index.html">Home</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="impressum.html">Impressum</a>
    </nav>
    <div class="site-footer-bottom">
      <div>Knotty is made by <strong>ponyokiki</strong> &middot; Berlin, Germany</div>
    </div>
  </footer>

</div>
</body>
</html>
